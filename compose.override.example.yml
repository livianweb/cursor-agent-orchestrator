# Copia a docker-compose.override.yml (gitignored) para exponer tu $HOME con la misma ruta
# absoluta dentro del contenedor (necesario para instalar en ~/proyectos).
#
#   cp compose.override.example.yml docker-compose.override.yml
#   # edita la ruta si no es /home/david

services:
  orchestrator-panel:
    volumes:
      - /home/david:/home/david:rw
